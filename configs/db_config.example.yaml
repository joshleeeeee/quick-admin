# ========================================
# 数据库连接配置文件（示例模板）
# ========================================
# 
# 使用说明：
# 1. 复制此文件为 db_config.yaml
# 2. 修改为你的实际数据库配置
# 3. db_config.yaml 已被 .gitignore 忽略，不会提交
#
# 支持的数据库类型：mysql / oracle / postgresql / sqlite
# ========================================


# ----------------------------------------
# 【Demo 模式】SQLite 演示数据库（开箱即用）
# ----------------------------------------
# 无需配置外部数据库，使用内置示例数据体验功能
# 首次使用请运行: python scripts/init_demo.py
demo:
  type: "sqlite"
  host: "localhost"
  port: 0
  user: "demo"
  password: "demo"
  database: "data/demo.db"


# ----------------------------------------
# 【示例】MySQL 数据库
# ----------------------------------------
default:
  type: "mysql"
  host: "192.168.1.100"       # 数据库服务器IP
  port: 3306                  # 端口号
  user: "your_user"           # 用户名
  password: "your_password"   # 密码
  database: "your_database"   # 数据库名


