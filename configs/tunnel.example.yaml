# ========================================
# 内网穿透配置文件（示例模板）
# ========================================
#
# 使用说明：
# 1. 复制此文件为 tunnel.yaml
# 2. 填写你的 ngrok Authtoken（可选，未填将匿名使用，有会话限制）
# 3. 注册地址: https://dashboard.ngrok.com/get-started/your-authtoken
# 
# ========================================

# 是否启用内网穿透（启动时自动生成公网 URL）
enable: false

# ngrok 认证令牌 (建议配置，否则连接不稳定且域名有效期短)
auth_token: ""

# 隧道协议 (通常是 http)
protocol: "http"

# 指定服务器区域（选择离你物理距离最近的以获得更低延迟）
# - ap: 亚太地区（新加坡）-> 国内推荐
# - jp: 日本（东京）      -> 国内推荐
# - us: 美国（俄亥俄）    -> 默认
# - eu: 欧洲（法兰克福）
# - au: 澳洲（悉尼）
# - sa: 南美（圣保罗）
# - in: 印度（孟买）
region: "ap"


